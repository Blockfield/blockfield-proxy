# Пустое описание нового PR заполняется по diff и коммитам; любой сбой ничего не меняет.
name: PR text
on:
  pull_request:
    types: [opened]
permissions:
  contents: read
jobs:
  text:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: Blockfield/blockfield-workspace/.github/actions/release-text@967a62fafed15d5915a65edf1773d0b5b6f026ee
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELEASE_TEXT_MODEL: ${{ vars.RELEASE_TEXT_MODEL }}
        with:
          mode: pr
