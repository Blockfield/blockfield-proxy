name: Proxy
on:
  push:
    branches: [main]
    tags: ["v*"]
  # Bot-gate (enforcing): PR CI runs only when the GitHub App
  # `blockfield-review-bot[bot]` approves the CURRENT head SHA. Pushes to a PR
  # branch fire no workflow run at all; only the bot's APPROVED `pull_request_review`
  # (submitted) starts a runner. Any other review matches the trigger but skips
  # every job at the job-level `if:`, so the run is all-skipped and bills
  # 0 minutes. A stale approval (push between the
  # review and the run) is rejected by the commit_id == head SHA check below.
  # Draft PRs get no bot verdict, so no CI runs until the PR is marked ready.
  # Merge protection pairs this gate with the bot's own `bot-review` commit
  # status on the head SHA (success = approved, failure = changes requested).
  # Merge-tree note: review runs test the head tree, not the merge ref. That
  # is safe only paired with branch protection "require up to date" (an
  # up-to-date merge == the head tree) plus the main-push same-tree check,
  # which runs full CI whenever a merge produces a tree no green PR run
  # tested.
  pull_request_review:
    types: [submitted]
  # Maintainer-only manual override (no bot verdict needed): run it from the
  # PR branch and record why. Ordinary contributors cannot bypass the gate
  # with this; misuse is visible in the run history.
  workflow_dispatch:
    inputs:
      reason:
        description: "Override reason (maintainers only)"
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read # bot-gate reads blockfield-review-bot verdicts on the head SHA
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'pull_request_review' && (github.event.review.user.login != 'blockfield-review-bot[bot]' || github.event.review.state != 'approved')) && 'review-noise' || 'gate' }}
  # A review must never cancel the run it gates.
  cancel-in-progress: false
jobs:
  bot-gate:
    name: ${{ (github.event_name == 'pull_request_review' && (github.event.review.user.login != 'blockfield-review-bot[bot]' || github.event.review.state != 'approved')) && 'bot-gate (skipped review)' || 'bot-gate' }}
    # Enforcing: `check` runs on a PR head only when this job reports
    # verdict=permit with sha_match=true for the CURRENT head SHA, resolved
    # from the API at gate runtime (a push may have landed after the
    # triggering review event was created; the event payload would still name
    # the old head). The event head must equal the runtime head, and the
    # bot's latest verdict-bearing review on that SHA must be APPROVED.
    # Anything else (stale event, no verdict yet, REQUEST_CHANGES, DISMISSED,
    # a verdict on an older SHA) skips `check`, so the gate fails closed.
    # Always exits 0: denial is expressed through the outputs, and the bot's
    # own `bot-review` commit status blocks merge.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request_review' && github.event.review.user.login == 'blockfield-review-bot[bot]' && github.event.review.state == 'approved'
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
      sha_match: ${{ steps.gate.outputs.sha_match }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Evaluate blockfield-review-bot verdict for the current PR head SHA
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          bot='blockfield-review-bot[bot]'
          repo="${{ github.repository }}"
          # Current head, not the event snapshot: the review that triggered
          # this run may predate a newer push. Only the still-current head
          # may pass; a stale event waits for the newer review's run.
          HEAD_SHA=$(gh api "repos/$repo/pulls/$PR_NUMBER" --jq '.head.sha')
          verdict=deny-awaiting
          sha_match=false
          if [ "$EVENT_SHA" = "$HEAD_SHA" ]; then
            # Latest verdict-bearing bot review on the current head,
            # aggregated across API pages (gh --jq applies per page).
            # COMMENTED reviews carry no verdict and are excluded, so a later
            # comment cannot override an earlier verdict. (jq is preinstalled
            # on the runner. The head SHA is spliced in; gh --jq takes no
            # variable arguments.)
            state=$(gh api "repos/$repo/pulls/$PR_NUMBER/reviews" --paginate               --jq '[.[] | select(.user.login == "'"$bot"'" and .commit_id == "'"$HEAD_SHA"'")]'               | jq -r -s '[add[] | select(.state != "COMMENTED")] | sort_by(.id) | last | .state // empty')
            # The API returns uppercase states ("APPROVED"); normalize anyway.
            state=$(printf '%s' "$state" | tr '[:lower:]' '[:upper:]')
            case "$state" in
              APPROVED)
                verdict=permit
                sha_match=true
                ;;
              # CHANGES_REQUESTED -> deny; DISMISSED / empty stay
              # deny-awaiting (fail-closed).
              CHANGES_REQUESTED) verdict=deny ;;
            esac
          fi
          # `sha` always names the evaluated runtime head so logs and the
          # checkout below agree on what was gated.
          echo "event=${EVENT_SHA:0:12} head=${HEAD_SHA:0:12} bot_state=${state:-none} verdict=$verdict sha_match=$sha_match"
          {
            echo "verdict=$verdict"
            echo "sha_match=$sha_match"
            echo "sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"
  build:
    name: ${{ (github.event_name == 'pull_request_review' && (github.event.review.user.login != 'blockfield-review-bot[bot]' || github.event.review.state != 'approved')) && 'build (skipped review)' || 'build' }}
    # Main/tag pushes and maintainer dispatches always run; PR heads run only
    # on a gate permit for the exact head SHA.
    needs: [bot-gate]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (needs.bot-gate.outputs.verdict == 'permit' && needs.bot-gate.outputs.sha_match == 'true'))
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_review' && needs.bot-gate.outputs.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Determine image input changes
        id: image-scope
        env:
          BASE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # Unknown comparisons and tags always validate; PRs skip the image steps.
          if [ "$EVENT_NAME" != push ] || [ "$REF_TYPE" = tag ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            image=true
          elif git diff --quiet "$BASE_SHA" HEAD -- proxy/ distribution/ scripts/quality.py scripts/toolchain.py scripts/tools.lock.json .github/workflows/build.yml justfile .dockerignore; then
            image=false
          else
            image=true
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21.0.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
      - name: Cache pinned project tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/quality
            .dev/jdk
          key: quality-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/tools.lock.json', 'scripts/toolchain.py', 'scripts/toolchain_local.py', 'scripts/quality.py') }}
      - run: python -I -X utf8 scripts/toolchain.py --ci
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Lint Python, shell, workflows and Java
        run: just lint
      - name: Check source formatting
        run: just format-check
      - name: Run Java unit tests
        run: just test
      - name: Publish Java test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proxy-java-tests
          path: |
            proxy/plugin/build/test-results/test/*.xml
            proxy/plugin/build/reports/tests/test/
          retention-days: 7
          if-no-files-found: ignore
      - name: Build checked plugin
        run: just build
      # The JAR depends only on the pinned upstream commit, the patches and Maven: rebuilding it took ~2.5 min a run.
      - name: Restore the built Limbo
        id: limbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: proxy/limbo-build/Limbo-0.7.10-ALPHA-1.21.1.jar
          key: limbo-29571119f9df-maven-3.9.11-${{ hashFiles('proxy/limbo/*.patch') }}
      - if: steps.limbo.outputs.cache-hit != 'true'
        name: Build pinned Limbo with checked patches
        env:
          MAVEN_OPTS: -Xmx2G
        run: |
          mkdir -p .cache/quality proxy/limbo-build
          archive=.cache/quality/apache-maven-3.9.11-bin.tar.gz
          test -f "$archive" || curl --fail --location --silent --show-error \
            --retry 4 --retry-all-errors --retry-max-time 1200 --connect-timeout 30 --max-time 300 \
            https://archive.apache.org/dist/maven/maven-3/3.9.11/binaries/apache-maven-3.9.11-bin.tar.gz --output "$archive"
          echo "bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978  $archive" | sha512sum --check
          tar -xzf "$archive" -C .cache/quality
          limbo_dir=$(mktemp -d "$RUNNER_TEMP/limbo.XXXXXX")
          trap 'rm -rf "$limbo_dir"' EXIT
          git clone --quiet https://github.com/LOOHP/Limbo "$limbo_dir"
          git -C "$limbo_dir" checkout --quiet 29571119f9df6737b5025b9ff1207e49b90cac82
          for patch in "$PWD"/proxy/limbo/*.patch; do git -C "$limbo_dir" apply "$patch"; done
          .cache/quality/apache-maven-3.9.11/bin/mvn -q -B -Dmaven.repo.local="$PWD/.cache/quality/maven-repository" -f "$limbo_dir/pom.xml" -DskipTests package
          cp "$limbo_dir/target/Limbo-0.7.10-ALPHA-1.21.1.jar" proxy/limbo-build/
      - name: Check Limbo biome palettes against registry order
        run: java -Xmx256m --class-path proxy/limbo-build/Limbo-0.7.10-ALPHA-1.21.1.jar proxy/limbo/CheckBiomes.java
      # Same job as the checked JARs: no artifact handoff, so the shared org artifact quota cannot block a release.
      - if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.image-scope.outputs.image == 'true'
        uses: docker/setup-buildx-action@v3
      - if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.image-scope.outputs.image == 'true' && github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.image-scope.outputs.image == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          cache-from: type=gha,scope=blockfield-proxy
          cache-to: type=gha,mode=max,scope=blockfield-proxy
          file: distribution/Dockerfile.proxy
          target: ci
          push: ${{ github.ref_type == 'tag' }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ github.event_name == 'pull_request' && format('ghcr.io/blockfield/blockfield-proxy:pr-{0}', github.event.pull_request.number) || format('ghcr.io/blockfield/blockfield-proxy:{0}', github.ref_name) }}
  # Описание версии: только GitHub Release с release-notes.md и announcement.json; деплой — отдельный ручной workflow.
  release:
    name: ${{ (github.event_name == 'pull_request_review' && (github.event.review.user.login != 'blockfield-review-bot[bot]' || github.event.review.state != 'approved')) && 'release (skipped review)' || 'release' }}
    if: github.ref_type == 'tag'
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read # release-text reads the merged pull requests of the range
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Release text
        uses: Blockfield/blockfield-workspace/.github/actions/release-text@2f20c9e9f66ddf63fbb59196c1ab69cfe30356d2
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELEASE_TEXT_MODEL: ${{ vars.RELEASE_TEXT_MODEL }}
        with:
          mode: release
          version: ${{ github.ref_name }}
          kind: proxy
          out-dir: rn
      - name: Publish version GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          files=(rn/release-notes.md)
          [ -f rn/announcement.json ] && files+=(rn/announcement.json)
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "Blockfield proxy $GITHUB_REF_NAME" \
              --notes-file rn/release-notes.md "${files[@]}"
          elif gh release download "$GITHUB_REF_NAME" --pattern release-notes.md --output rn/published.md 2>/dev/null \
              && cmp -s rn/published.md rn/release-notes.md; then
            echo "release-notes.md already published"
          else
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file rn/release-notes.md
          fi
