name: Proxy
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    outputs:
      image: ${{ steps.image-scope.outputs.image }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Determine image input changes
        id: image-scope
        env:
          BASE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # Unknown comparisons and tags always validate; PRs retain self-hosted checks.
          if [ "$EVENT_NAME" != push ] || [ "$REF_TYPE" = tag ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            image=true
          elif git diff --quiet "$BASE_SHA" HEAD -- proxy/ distribution/ scripts/quality.py scripts/toolchain.py .github/workflows/build.yml justfile .dockerignore; then
            image=false
          else
            image=true
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21.0.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
      - name: Cache pinned project tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/quality
            .dev/jdk
          key: quality-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('scripts/toolchain.py', 'scripts/quality.py', 'dev/quality.py') }}
      - run: python -I -X utf8 scripts/toolchain.py --ci
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Lint Python, shell, workflows and Java
        run: just lint
      - name: Check source formatting
        run: just format-check
      - name: Run Java unit tests
        run: just test
      - name: Publish Java test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proxy-java-tests
          path: |
            proxy/plugin/build/test-results/test/*.xml
            proxy/plugin/build/reports/tests/test/
          retention-days: 7
          if-no-files-found: ignore
      - name: Build checked plugin
        run: just build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proxy-plugin
          path: proxy/plugin/build/libs/blockfield-proxy-1.0.0.jar
          retention-days: 1
          if-no-files-found: error
      - name: Build pinned Limbo with checked patches
        env:
          MAVEN_OPTS: -Xmx2G
        run: |
          mkdir -p .cache/quality proxy/limbo-build
          archive=.cache/quality/apache-maven-3.9.11-bin.tar.gz
          test -f "$archive" || curl --fail --location --silent --show-error \
            --retry 4 --retry-all-errors --retry-max-time 1200 --connect-timeout 30 --max-time 300 \
            https://archive.apache.org/dist/maven/maven-3/3.9.11/binaries/apache-maven-3.9.11-bin.tar.gz --output "$archive"
          echo "bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978  $archive" | sha512sum --check
          tar -xzf "$archive" -C .cache/quality
          limbo_dir=$(mktemp -d "$RUNNER_TEMP/limbo.XXXXXX")
          trap 'rm -rf "$limbo_dir"' EXIT
          git clone --quiet https://github.com/LOOHP/Limbo "$limbo_dir"
          git -C "$limbo_dir" checkout --quiet 29571119f9df6737b5025b9ff1207e49b90cac82
          for patch in "$PWD"/proxy/limbo/*.patch; do git -C "$limbo_dir" apply "$patch"; done
          .cache/quality/apache-maven-3.9.11/bin/mvn -q -B -Dmaven.repo.local="$PWD/.cache/quality/maven-repository" -f "$limbo_dir/pom.xml" -DskipTests package
          cp "$limbo_dir/target/Limbo-0.7.10-ALPHA-1.21.1.jar" proxy/limbo-build/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proxy-limbo
          path: proxy/limbo-build/Limbo-0.7.10-ALPHA-1.21.1.jar
          retention-days: 1
          if-no-files-found: error
  image:
    if: github.event_name != 'pull_request' && needs.build.outputs.image == 'true'
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: proxy-plugin
          path: proxy/plugin/build/libs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: proxy-limbo
          path: proxy/limbo-build
      - uses: docker/setup-buildx-action@v3
      - if: github.ref_type == 'tag' || github.ref == 'refs/heads/dev'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          cache-from: type=gha,scope=blockfield-proxy
          cache-to: type=gha,mode=max,scope=blockfield-proxy
          file: distribution/Dockerfile.proxy
          target: ci
          push: ${{ github.ref_type == 'tag' || github.ref == 'refs/heads/dev' }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ github.event_name == 'pull_request' && format('ghcr.io/blockfield/blockfield-proxy:pr-{0}', github.event.pull_request.number) || format('ghcr.io/blockfield/blockfield-proxy:{0}', github.ref_name) }}
  # Описание версии: только GitHub Release с release-notes.md и announcement.json; деплой — отдельный ручной workflow.
  release:
    if: github.ref_type == 'tag'
    needs: image
    runs-on: [self-hosted, tiny]
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read # release-text reads the merged pull requests of the range
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Release text
        uses: Blockfield/blockfield-workspace/.github/actions/release-text@9c2b9371f09f7ce48d31361d071bbbe00d9bffde
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELEASE_TEXT_MODEL: ${{ vars.RELEASE_TEXT_MODEL }}
        with:
          mode: release
          version: ${{ github.ref_name }}
          kind: proxy
          out-dir: rn
      - name: Publish version GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          files=(rn/release-notes.md)
          [ -f rn/announcement.json ] && files+=(rn/announcement.json)
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "Blockfield proxy $GITHUB_REF_NAME" \
              --notes-file rn/release-notes.md "${files[@]}"
          elif gh release download "$GITHUB_REF_NAME" --pattern release-notes.md --output rn/published.md 2>/dev/null \
              && cmp -s rn/published.md rn/release-notes.md; then
            echo "release-notes.md already published"
          else
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file rn/release-notes.md
          fi
