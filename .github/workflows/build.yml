name: Proxy
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew build --no-daemon --console=plain
        working-directory: proxy/plugin
      - name: Validate release notes
        if: github.ref_type == 'tag'
        run: |
          test -f "release-notes/$GITHUB_REF_NAME.md" || { echo "missing release-notes/$GITHUB_REF_NAME.md: prepare it in the release PR"; exit 1; }
          python3 scripts/release-notes-tool.py check "release-notes/$GITHUB_REF_NAME.md" \
            --repository Blockfield/blockfield-proxy --version "$GITHUB_REF_NAME" --kind server
      - uses: docker/setup-buildx-action@v3
      - if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: distribution/Dockerfile.proxy
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ github.event_name == 'pull_request' && format('ghcr.io/blockfield/blockfield-proxy:pr-{0}', github.event.pull_request.number) || format('ghcr.io/blockfield/blockfield-proxy:{0}', github.ref_name) }}
  # Описание версии: только GitHub Release с release-notes.md; деплой — отдельный ручной workflow.
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish version GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p rn && cp "release-notes/$GITHUB_REF_NAME.md" rn/release-notes.md
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "Blockfield proxy $GITHUB_REF_NAME" \
              --notes-file rn/release-notes.md rn/release-notes.md
          elif gh release download "$GITHUB_REF_NAME" --pattern release-notes.md --output rn/published.md 2>/dev/null \
              && cmp -s rn/published.md rn/release-notes.md; then
            echo "release-notes.md already published"
          else
            gh release upload "$GITHUB_REF_NAME" rn/release-notes.md --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file rn/release-notes.md
          fi
