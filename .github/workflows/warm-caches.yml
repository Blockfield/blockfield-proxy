name: Warm CI caches
# Issue Blockfield/blockfield-coordination#14: the quality tools cache
# (`quality-tools-v1-*`) and the Limbo build cache (`limbo-*`) must be
# readable by a fresh PR's FIRST review run. A `pull_request_review` run
# restores only its own ref's scope and the default branch (`main`) — never
# the base branch (`next`) — so warming under any other scope burns minutes
# without a reader. This workflow therefore warms under the default-branch
# ref: pushes to `next` only dispatch (cheap, runs in seconds), and the
# dispatched run (ref `main`, tree `next`) saves exactly the entries the
# `build` workflow restores, which review runs then hit.
# Only workflow_dispatch/push/schedule runs may write the default-branch
# scope, so the dispatch targets `--ref main` (the file must exist on `main`,
# i.e. this starts working after the next release merge carries it over;
# until then the dispatch step skips silently and first runs stay cold).
# Keys and paths are copies of build.yml's; scripts/quality.py lint() fails
# the PR gate if they ever differ (no silent drift).
on:
  push:
    branches: [next]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: warm-caches
  cancel-in-progress: true
jobs:
  dispatch:
    # A push-to-`next` run would save under the `next` scope, which no review
    # run reads: warming here burns minutes without a reader. Forward instead.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch main-scope warm run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The dispatched file resolves on `main`. Pre-release it is not
          # there yet, so the dispatch would 404: skip, caches stay cold.
          if gh api "repos/${{ github.repository }}/contents/.github/workflows/warm-caches.yml?ref=main" >/dev/null 2>&1; then
            gh workflow run warm-caches.yml --repo "${{ github.repository }}" --ref main
          else
            echo "warm-caches.yml not on main yet (pre-release); skipping"
          fi
  warm:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          # Run under the default-branch ref (cache scope) but warm the tree
          # reviewers will build. Fixed, not an input: these entries feed every
          # PR check, so a dispatch must not be able to fill them from another ref.
          ref: next
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21.0.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
      - name: Cache pinned project tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/quality
            .dev/jdk
          key: quality-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/tools.lock.json', 'scripts/toolchain.py', 'scripts/toolchain_local.py', 'scripts/quality.py') }}
      - run: python -I -X utf8 scripts/toolchain.py --ci
      # The JAR depends only on the pinned upstream commit, the patches and Maven.
      - name: Restore the built Limbo
        id: limbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: proxy/limbo-build/Limbo-0.7.10-ALPHA-1.21.1.jar
          key: limbo-29571119f9df-maven-3.9.11-${{ hashFiles('proxy/limbo/*.patch') }}
      - if: steps.limbo.outputs.cache-hit != 'true'
        name: Build pinned Limbo with checked patches
        env:
          MAVEN_OPTS: -Xmx2G
        run: |
          mkdir -p .cache/quality proxy/limbo-build
          archive=.cache/quality/apache-maven-3.9.11-bin.tar.gz
          test -f "$archive" || curl --fail --location --silent --show-error \
            --retry 4 --retry-all-errors --retry-max-time 1200 --connect-timeout 30 --max-time 300 \
            https://archive.apache.org/dist/maven/maven-3/3.9.11/binaries/apache-maven-3.9.11-bin.tar.gz --output "$archive"
          echo "bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978  $archive" | sha512sum --check
          tar -xzf "$archive" -C .cache/quality
          limbo_dir=$(mktemp -d "$RUNNER_TEMP/limbo.XXXXXX")
          trap 'rm -rf "$limbo_dir"' EXIT
          git clone --quiet https://github.com/LOOHP/Limbo "$limbo_dir"
          git -C "$limbo_dir" checkout --quiet 29571119f9df6737b5025b9ff1207e49b90cac82
          for patch in "$PWD"/proxy/limbo/*.patch; do git -C "$limbo_dir" apply "$patch"; done
          .cache/quality/apache-maven-3.9.11/bin/mvn -q -B -Dmaven.repo.local="$PWD/.cache/quality/maven-repository" -f "$limbo_dir/pom.xml" -DskipTests package
          cp "$limbo_dir/target/Limbo-0.7.10-ALPHA-1.21.1.jar" proxy/limbo-build/
