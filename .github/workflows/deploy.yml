name: Deploy proxy
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published proxy image tag (restarts player connections)"
        required: true
      without_rollback:
        description: "Allow a deploy whose running proxy image is outside ghcr.io/blockfield (no automatic rollback)"
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
concurrency:
  group: blockfield-proxy-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: blockfield-deploy
    env:
      # Redeploys only the proxy's :latest channel; no Dokploy API key in Actions.
      DOKPLOY_PROXY_WEBHOOK: ${{ secrets.DOKPLOY_PROXY_WEBHOOK }}
    # Rollout and its rollback at the deploy-webhooks.py limits.
    timeout-minutes: 60
    steps:
      - run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bootstrap pinned project tools
        run: python3 -I -X utf8 scripts/toolchain.py --ci
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Deploy the exact release, roll back to the running digest on failure
        env:
          TAG: ${{ inputs.tag }}
          WITHOUT_ROLLBACK: ${{ inputs.without_rollback }}
        run: |
          just python - <<'PYCODE'
          import os, sys
          sys.path.insert(0, 'scripts')
          hooks = __import__('deploy-webhooks')
          digest = hooks.release_digest('blockfield-proxy', os.environ['TAG'])
          try:
              previous = hooks.current('blockfield-proxy')
          except ValueError as error:
              if os.environ['WITHOUT_ROLLBACK'] != 'true':
                  raise SystemExit(f'{error}: rerun with without_rollback to deploy anyway')
              previous = None
          try:
              hooks.deploy('blockfield-proxy', digest)
          except BaseException:
              if previous:
                  hooks.deploy('blockfield-proxy', previous)
              raise
          PYCODE
