plugins {
    id 'java'
}

version = '1.0.0'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'com.velocitypowered:velocity-api:3.5.1'
    annotationProcessor 'com.velocitypowered:velocity-api:3.5.1'
    testImplementation 'com.velocitypowered:velocity-api:3.5.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('lintJava', JavaCompile) {
    dependsOn 'testClasses'
    source sourceSets.main.allJava, sourceSets.test.allJava
    classpath = sourceSets.main.compileClasspath + sourceSets.test.compileClasspath + sourceSets.main.output + sourceSets.test.output
    destinationDirectory = layout.buildDirectory.dir('classes/java/lint')
    options.annotationProcessorPath = files()
    options.compilerArgs += ['-proc:none', '-Xlint:divzero,empty,fallthrough,finally,-removal', '-Werror']
}
tasks.named('check') { dependsOn tasks.named('lintJava') }
